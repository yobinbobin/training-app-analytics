# Example content, not copied from any company's systems.
intents:
  greeting:
    phrases: ["привет", "здравствуйте", "добрый день"]
  operator:
    phrases: ["позови оператора", "соедини с оператором", "оператор", "человек", "живой специалист", "поддержка"]
  order_status:
    phrases: ["где мой заказ", "статус заказа", "где заказ", "когда доставка", "отследить"]
  return_order:
    phrases: ["возврат", "вернуть товар", "вернуть заказ"]
  cancel_order:
    phrases: ["отменить", "отмена заказа"]
  change_address:
    phrases: ["сменить адрес", "изменить адрес", "адрес доставки"]
requires_order: [order_status, return_order, cancel_order, change_address]
status_labels:
  new: "создан и ожидает обработки"
  in_transit: "передан в доставку"
  delivered: "доставлен"
responses:
  hello: "Привет! Могу подсказать статус заказа, правила отмены и возврата или переключить на специалиста. Что нужно?"
  fallback: "Пока не понял запрос. Можно написать: 'где заказ', 'отменить заказ', 'возврат' или 'оператор'."
  operator: "Понимаю. В реальном сервисе здесь была бы передача специалисту. В этой демонстрации соединение не выполняется."
  ask_order: "Укажи номер заказа в формате A1001. Не присылай адреса, телефоны или личные данные - в демо они не нужны."
  not_found: "Не нашёл такой номер в демонстрационной базе. Попробуй A1001, A1002 или A1003."
  status: "Заказ {order_id}: {status}. Это тестовые данные, не настоящая доставка."
  return_delivered: "Для доставленного заказа можно начать оформление возврата. В демо я показываю только сценарий, реального возврата нет."
  return_not_delivered: "Заказ ещё не доставлен. Могу помочь разобраться с отменой или передать вопрос специалисту."
  cancel_possible: "Заказ ещё не отправлен. В реальном сервисе здесь можно показать подтверждение отмены. Демо ничего не отменяет."
  cancel_unavailable: "Заказ уже в обработке или доставлен. В демо отмена недоступна; можно обратиться к специалисту."
  address_possible: "Заказ ещё не передан в доставку. В реальном сервисе можно предложить изменение адреса с подтверждением. Демо ничего не меняет."
  address_unavailable: "Заказ уже передан дальше. Для уточнения изменения адреса понадобится специалист."
